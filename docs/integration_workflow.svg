  <text x="600" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">sonnet-4-6</text>
  <line x1="470" y1="295" x2="730" y2="295" stroke="#ede9fe" stroke-width="1"/>
  <text x="470" y="313" text-anchor="start" font-size="11" fill="#5b21b6">• Compound signal reasoning</text>
  <text x="470" y="330" text-anchor="start" font-size="11" fill="#5b21b6">• Context-aware scoring</text>
  <text x="470" y="347" text-anchor="start" font-size="11" fill="#5b21b6">• Generative personalization</text>

