  <line x1="456" y1="425" x2="456" y2="470" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="744" y1="425" x2="744" y2="470" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
