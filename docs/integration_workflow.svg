  <text x="1032" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">+ Bing</text>
  <text x="1032" y="104" text-anchor="middle" font-size="11" fill="#374151">Channel performance data</text>
  <text x="1032" y="120" text-anchor="middle" font-size="11" fill="#6b7280">Spend and conversion metrics</text>

