  <!-- ═══════════════════════════════════════════════════ -->
  <text x="168" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">Live — V1</text>
  <text x="456" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Live — V1</text>
  <text x="744" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">V2 — weeks 1-2</text>

