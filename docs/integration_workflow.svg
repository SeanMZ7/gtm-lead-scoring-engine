  <text x="600" y="681" text-anchor="middle" font-size="12" fill="#374151">Scoring results + routing action written to lead and contact records</text>
  <text x="600" y="698" text-anchor="middle" font-size="11" fill="#6b7280">Full funnel visibility for AEs and BDRs  •  V2 — weeks 1-2</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- DASHED FEEDBACK ARROW (left side)                  -->
  <!-- ═══════════════════════════════════════════════════ -->
  <path d="M 48,676 L 20,676 L 20,318 L 40,318" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-end)"/>

  <!-- Feedback label (rotated vertical) -->
  <text x="10" y="497" text-anchor="middle" font-size="10" fill="#9ca3af" transform="rotate(-90, 10, 497)">Rep feedback + deal outcomes</text>

