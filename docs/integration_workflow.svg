  <text x="92" y="315" text-anchor="start" font-size="11" fill="#0f766e">• Buying signal detection</text>
  <text x="92" y="332" text-anchor="start" font-size="11" fill="#0f766e">• Priority flagging</text>
  <text x="92" y="349" text-anchor="start" font-size="11" fill="#0f766e">• Email drafting</text>

