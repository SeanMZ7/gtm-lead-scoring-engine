  <text x="1032" y="494" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Suppressed</text>
  <text x="1032" y="515" text-anchor="middle" font-size="11" fill="#6b7280">Remove from active outreach</text>
  <text x="1032" y="531" text-anchor="middle" font-size="11" fill="#6b7280">No rep time spent</text>

