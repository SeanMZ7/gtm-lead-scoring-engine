<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui, -apple-system, Helvetica Neue, sans-serif">

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- COORDINATE MAP                                                      -->
  <!-- Tier 1  Input:         y=60–160  (boxes w=300, 3 cols at x=50,450,850) -->
  <!-- Tier 2  Scoring:       y=190–390 (container x=40 w=1120)           -->
  <!--         Inner boxes:   y=230–378 (left x=70 w=490, right x=640 w=490) -->
  <!-- Tier 3  Intelligence:  y=418–518 (x=300 w=600)                     -->
  <!-- Tier 4  Orchestration: y=554–644 (left x=40 w=540, right x=620 w=540) -->
  <!-- Tier 5  Output:        y=681–761 (4×w=240 at x=48,336,624,912)     -->
  <!-- Routing bus:           y=656                                         -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <defs>
    <filter id="sh" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
    <!-- Arrow marker — open chevron, gray -->
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L8.5,4 L0,7.5" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION LABEL — INPUT LAYER                         -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="600" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">INPUT LAYER</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TIER 1 — INPUT BOXES (y=60, h=100)                 -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Lead data — x=50, w=300, center=200 -->
  <rect x="50" y="60" width="300" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="87" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Lead data</text>
  <text x="200" y="107" text-anchor="middle" font-size="13" fill="#374151">dummy_leads.csv</text>
  <text x="200" y="123" text-anchor="middle" font-size="11" fill="#6b7280">10 fields: title, industry, size,</text>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#6b7280">signal, channel, offer type</text>

  <!-- Trial user data — x=450, w=300, center=600 -->
  <rect x="450" y="60" width="300" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
  <text x="600" y="87" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Trial user data</text>
  <text x="600" y="107" text-anchor="middle" font-size="13" fill="#374151">dummy_trials.csv</text>
  <text x="600" y="123" text-anchor="middle" font-size="11" fill="#6b7280">22 fields: sessions, features,</text>
  <text x="600" y="138" text-anchor="middle" font-size="11" fill="#6b7280">milestones, engagement signals</text>

  <!-- ICP configuration — x=850, w=300, center=1000 -->
  <rect x="850" y="60" width="300" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1000" y="87" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">ICP configuration</text>
  <text x="1000" y="107" text-anchor="middle" font-size="13" fill="#374151">config/icp_config.json</text>
  <text x="1000" y="123" text-anchor="middle" font-size="11" fill="#6b7280">Editable by GTM team —</text>
  <text x="1000" y="138" text-anchor="middle" font-size="11" fill="#6b7280">no code required</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROWS T1 → T2 (straight vertical)                 -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Lead data → container top -->
  <line x1="200" y1="160" x2="200" y2="188" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Trial user data → container top -->
  <line x1="600" y1="160" x2="600" y2="188" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- ICP config: solid stem to branch_y=170 (container_top-20), then two dashed L-bends -->
  <!-- Solid stem: ICP bottom center (1000,160) straight down to branch point y=170 -->
  <line x1="1000" y1="160" x2="1000" y2="170" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- Path A (dashed): left to score_leads center x=315, then down to score_leads top y=230 -->
  <path d="M1000,170 L315,170 L315,230" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- Path B (dashed): left to score_trials center x=885, then down to score_trials top y=230 -->
  <path d="M1000,170 L885,170 L885,230" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION LABEL — SCORING ENGINE                      -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="600" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">SCORING ENGINE</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TIER 2 — SCORING ENGINE CONTAINER (y=190, h=200)   -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Outer container -->
  <rect x="40" y="190" width="1120" height="200" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>

  <!-- Container title -->
  <text x="600" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">Scoring engine — Claude sonnet-4-6</text>

  <!-- score_leads.py — x=70, y=230, w=490, h=148 -->
  <rect x="70" y="230" width="490" height="148" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#sh)"/>
  <text x="86" y="253" text-anchor="start" font-size="15" font-weight="700" fill="#111827">score_leads.py</text>
  <line x1="86" y1="260" x2="544" y2="260" stroke="#e0e7ff" stroke-width="1"/>
  <text x="86" y="278" text-anchor="start" font-size="12" fill="#4b5563">• ICP fit: title + industry + company size + geography</text>
  <text x="86" y="298" text-anchor="start" font-size="12" fill="#4b5563">• Signal: offer type + channel + buying signals</text>
  <text x="86" y="318" text-anchor="start" font-size="12" fill="#4b5563">• Priority flagging: Demo Request → 2-hour response</text>
  <text x="86" y="338" text-anchor="start" font-size="12" fill="#4b5563">• Email drafting: personalized first-touch for Hot leads</text>

  <!-- score_trials.py — x=640, y=230, w=490, h=148 -->
  <rect x="640" y="230" width="490" height="148" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#sh)"/>
  <text x="656" y="253" text-anchor="start" font-size="15" font-weight="700" fill="#111827">score_trials.py</text>
  <line x1="656" y1="260" x2="1114" y2="260" stroke="#e0e7ff" stroke-width="1"/>
  <text x="656" y="278" text-anchor="start" font-size="12" fill="#4b5563">• ICP fit: title + industry + size + Zapier disqualifier</text>
  <text x="656" y="298" text-anchor="start" font-size="12" fill="#4b5563">• Engagement: sessions + features + milestones + recency</text>
  <text x="656" y="318" text-anchor="start" font-size="12" fill="#4b5563">• Matrix: fit × engagement → routing tier</text>
  <text x="656" y="338" text-anchor="start" font-size="12" fill="#4b5563">• BDR drafts: re-engagement referencing trial behavior</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROWS T2 → T3 (L-bends, horizontal at y=394)      -->
  <!-- score_leads center x=315, score_trials center x=885 -->
  <!-- Claude API box target: x=490 left, x=710 right      -->
  <!-- ═══════════════════════════════════════════════════ -->
  <path d="M315,390 L315,394 L490,394 L490,418" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M885,390 L885,394 L710,394 L710,418" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION LABEL — INTELLIGENCE LAYER                  -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="600" y="407" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">INTELLIGENCE LAYER</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TIER 3 — CLAUDE API (x=300, y=418, w=600, h=100)   -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="300" y="418" width="600" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>

  <!-- Title -->
  <text x="600" y="442" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Claude API — claude-sonnet-4-6</text>
  <line x1="320" y1="450" x2="880" y2="450" stroke="#a7f3d0" stroke-width="1"/>

  <!-- Three column dividers -->
  <line x1="500" y1="455" x2="500" y2="510" stroke="#a7f3d0" stroke-width="1"/>
  <line x1="700" y1="455" x2="700" y2="510" stroke="#a7f3d0" stroke-width="1"/>

  <!-- Column 1: Compound reasoning (center x=400) -->
  <text x="400" y="469" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Compound reasoning</text>
  <text x="400" y="485" text-anchor="middle" font-size="11" fill="#065f46">All signals evaluated together</text>

  <!-- Column 2: Scoring + routing (center x=600) -->
  <text x="600" y="469" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Scoring + routing</text>
  <text x="600" y="485" text-anchor="middle" font-size="11" fill="#065f46">Hot / Warm / Cold + 4-tier</text>

  <!-- Column 3: Generative output (center x=800) -->
  <text x="800" y="469" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Generative output</text>
  <text x="800" y="485" text-anchor="middle" font-size="11" fill="#065f46">Personalized emails + BDR drafts</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROWS T3 → T4 (L-bends, horizontal at y=530)      -->
  <!-- Claude left exit x=420, right exit x=780            -->
  <!-- run_gtm center x=310, Flask center x=890            -->
  <!-- ═══════════════════════════════════════════════════ -->
  <path d="M420,518 L420,530 L310,530 L310,554" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M780,518 L780,530 L890,530 L890,554" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION LABEL — ORCHESTRATION + INTERFACE          -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="600" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">ORCHESTRATION + INTERFACE</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TIER 4 — ORCHESTRATION BOXES (y=554, h=90)         -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- run_gtm_engine.py — x=40, w=540, center=310 -->
  <rect x="40" y="554" width="540" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="56" y="579" text-anchor="start" font-size="15" font-weight="700" fill="#1e3a8a">run_gtm_engine.py — orchestrator</text>
  <text x="56" y="599" text-anchor="start" font-size="12" fill="#374151">• Runs both scoring scripts in sequence</text>
  <text x="56" y="617" text-anchor="start" font-size="12" fill="#374151">• Unified full-funnel report across leads and trial users</text>

  <!-- Flask web UI — x=620, w=540, center=890 -->
  <rect x="620" y="554" width="540" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="636" y="579" text-anchor="start" font-size="15" font-weight="700" fill="#1e3a8a">Flask web UI — app.py</text>
  <text x="636" y="599" text-anchor="start" font-size="12" fill="#374151">• Five pages: Dashboard, Lead Scoring, Trials, Full Funnel, ICP Settings</text>
  <text x="636" y="617" text-anchor="start" font-size="12" fill="#374151">• Non-technical operators can run the system from a browser</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROUTING BUS (y=656) + SECTION LABEL                 -->
  <!-- Stems from tier4 boxes → bus → drops to tier5       -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Bus architecture: bus_y = (644+681)/2 = 662.5 (halfway between orch bottom and output top) -->
  <!-- Step 1: stem from run_gtm bottom center (310,644) down to bus -->
  <line x1="310" y1="644" x2="310" y2="662.5" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- Step 2: stem from Flask UI bottom center (890,644) down to bus -->
  <line x1="890" y1="644" x2="890" y2="662.5" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- Step 3: horizontal bus spanning full width of output layer (x=40 to x=1160) -->
  <line x1="40" y1="662.5" x2="1160" y2="662.5" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Section label -->
  <text x="600" y="671" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.08em">OUTPUT LAYER</text>

  <!-- Step 4: vertical drop arrows from bus to top center of each output box -->
  <!-- Output box centers: 165, 455, 745, 1035  —  output box tops: y=681 -->
  <line x1="165" y1="662.5" x2="165" y2="679" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="455" y1="662.5" x2="455" y2="679" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="745" y1="662.5" x2="745" y2="679" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1035" y1="662.5" x2="1035" y2="679" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- TIER 5 — OUTPUT BOXES (y=681, h=80)                            -->
  <!-- Total usable width = 1120 (x=40 to x=1160, matching container) -->
  <!-- Formula: w = (1120 - 3×40) / 4 = 980/4 = 250px, gap = 40px    -->
  <!-- Positions: x=40,330,620,910  Centers: 165,455,745,1035         -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- AE Fast-Track (green) — x=40, w=250, center=165 -->
  <rect x="40" y="681" width="250" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="165" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">AE fast-track</text>
  <text x="165" y="722" text-anchor="middle" font-size="12" fill="#374151">Route to AE via ChiliPiper</text>
  <text x="165" y="738" text-anchor="middle" font-size="11" fill="#6b7280">Same-day booking</text>

  <!-- BDR Sequence (purple) — x=330, w=250, center=455 -->
  <rect x="330" y="681" width="250" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
  <text x="455" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">BDR sequence</text>
  <text x="455" y="722" text-anchor="middle" font-size="12" fill="#374151">Enroll via Outreach</text>
  <text x="455" y="738" text-anchor="middle" font-size="11" fill="#6b7280">Personalized draft in rep inbox</text>

  <!-- CS Monitor (amber) — x=620, w=250, center=745 -->
  <rect x="620" y="681" width="250" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="745" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">CS monitor</text>
  <text x="745" y="722" text-anchor="middle" font-size="12" fill="#374151">Tag in Salesforce</text>
  <text x="745" y="738" text-anchor="middle" font-size="11" fill="#6b7280">Re-score in 30 days</text>

  <!-- Suppressed (gray) — x=910, w=250, center=1035 -->
  <rect x="910" y="681" width="250" height="80" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1035" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Suppressed</text>
  <text x="1035" y="722" text-anchor="middle" font-size="12" fill="#374151">Remove from active outreach</text>
  <text x="1035" y="738" text-anchor="middle" font-size="11" fill="#6b7280">No rep time spent</text>

</svg>
